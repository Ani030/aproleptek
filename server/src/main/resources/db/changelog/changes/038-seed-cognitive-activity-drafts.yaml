              insert into taxonomy_term(term_type,name,slug,sort_order,active,parent_id,default_description)
              values ('ACTIVITY_TOPIC','Gondolkodás és kognitív fejlődés','gondolkodas-es-kognitiv-fejlodes',40,true,null,'A gondolkodás és a kognitív fejlődés során a gyermek megtanulja felismerni az összefüggéseket, rendszerezni az információkat, következtetéseket levonni, problémákat megoldani és a megszerzett tudását új helyzetekben alkalmazni. A játékötletek között nyomtatható feladatlapok, tépőzáras játékok és hétköznapi eszközökkel végezhető tevékenységek is helyet kapnak.') on conflict (term_type,slug) do update set name=excluded.name,sort_order=excluded.sort_order,active=true,parent_id=null,default_description=excluded.default_description;
              insert into taxonomy_term(term_type,name,slug,sort_order,active,parent_id)
              select 'ACTIVITY_TOPIC',v.name,v.slug,v.sort_order,true,root.id from (values
                ('Párosítás és összetartozás','parositas-es-osszetartozas',10),
                ('Kategorizálás és csoportosítás','kategorizalas-es-csoportositas',20),
                ('Ok-okozati gondolkodás','ok-okozati-gondolkodas',30),
                ('Problémamegoldás','problemamegoldas',40),
                ('Sorrendiség és időbeli gondolkodás','sorrendiseg-es-idobeli-gondolkodas',50),
                ('Logikai sorozatok és szabályszerűségek','logikai-sorozatok-es-szabalyszerusegek',60),
                ('Rész-egész kapcsolatok','resz-egesz-kapcsolatok',70),
                ('Következtetés és összefüggések felismerése','kovetkeztetes-es-osszefuggesek-felismerese',80),
                ('Matematikai gondolkodás','matematikai-gondolkodas',90),
                ('Tervezés és rugalmas gondolkodás','tervezes-es-rugalmas-gondolkodas',100)) as v(name,slug,sort_order) cross join taxonomy_term root where root.term_type='ACTIVITY_TOPIC' and root.slug='gondolkodas-es-kognitiv-fejlodes' on conflict (term_type,slug) do update set name=excluded.name,sort_order=excluded.sort_order,active=true,parent_id=excluded.parent_id;
