databaseChangeLog:
  - changeSet:
      id: 006-expense-and-material-purchases
      author: codex
      changes:
        - createTable:
            tableName: material_item
            columns:
              - column: { name: id, type: UUID, defaultValueComputed: gen_random_uuid(), constraints: { primaryKey: true, nullable: false } }
              - column: { name: name, type: VARCHAR(160), constraints: { nullable: false, unique: true } }
              - column: { name: unit_name, type: VARCHAR(30), constraints: { nullable: false } }
              - column: { name: active, type: BOOLEAN, defaultValueBoolean: true, constraints: { nullable: false } }
              - column: { name: created_at, type: TIMESTAMP WITH TIME ZONE, defaultValueComputed: CURRENT_TIMESTAMP, constraints: { nullable: false } }
        - createTable:
            tableName: material_purchase
            columns:
              - column: { name: id, type: UUID, defaultValueComputed: gen_random_uuid(), constraints: { primaryKey: true, nullable: false } }
              - column: { name: material_id, type: UUID, constraints: { nullable: false, foreignKeyName: fk_purchase_material, references: material_item(id) } }
              - column: { name: purchase_date, type: DATE, defaultValueComputed: CURRENT_DATE, constraints: { nullable: false } }
              - column: { name: quantity, type: 'DECIMAL(12,3)', constraints: { nullable: false } }
              - column: { name: total_cost, type: 'DECIMAL(12,2)', constraints: { nullable: false } }
              - column: { name: unit_cost, type: 'DECIMAL(12,4)', constraints: { nullable: false } }
              - column: { name: note, type: TEXT }
              - column: { name: created_at, type: TIMESTAMP WITH TIME ZONE, defaultValueComputed: CURRENT_TIMESTAMP, constraints: { nullable: false } }
        - sql:
            sql: ALTER TABLE material_purchase ADD CONSTRAINT ck_purchase_quantity_positive CHECK (quantity > 0), ADD CONSTRAINT ck_purchase_cost_nonnegative CHECK (total_cost >= 0)
        - createIndex:
            tableName: material_purchase
            indexName: ix_purchase_material_date
            columns:
              - column: { name: material_id }
              - column: { name: purchase_date }
        - createTable:
            tableName: expense_record
            columns:
              - column: { name: id, type: UUID, defaultValueComputed: gen_random_uuid(), constraints: { primaryKey: true, nullable: false } }
              - column: { name: category, type: VARCHAR(20), constraints: { nullable: false } }
              - column: { name: title, type: VARCHAR(200), constraints: { nullable: false } }
              - column: { name: expense_date, type: DATE, defaultValueComputed: CURRENT_DATE, constraints: { nullable: false } }
              - column: { name: amount, type: 'DECIMAL(12,2)', constraints: { nullable: false } }
              - column: { name: note, type: TEXT }
              - column: { name: created_at, type: TIMESTAMP WITH TIME ZONE, defaultValueComputed: CURRENT_TIMESTAMP, constraints: { nullable: false } }
        - sql:
            sql: ALTER TABLE expense_record ADD CONSTRAINT ck_expense_category CHECK (category IN ('EQUIPMENT','OTHER')), ADD CONSTRAINT ck_expense_amount_positive CHECK (amount > 0)
        - createIndex:
            tableName: expense_record
            indexName: ix_expense_date
            columns:
              - column: { name: expense_date }
      rollback:
        - dropTable: { tableName: expense_record }
        - dropTable: { tableName: material_purchase }
        - dropTable: { tableName: material_item }
