databaseChangeLog:
  - changeSet:
      id: 027-material-stock-movements
      author: codex
      changes:
        - createTable:
            tableName: material_stock_movement
            columns:
              - column: { name: id, type: UUID, defaultValueComputed: gen_random_uuid(), constraints: { primaryKey: true, nullable: false } }
              - column: { name: material_id, type: UUID, constraints: { nullable: false, foreignKeyName: fk_material_movement_material, references: material_item(id) } }
              - column: { name: source_type, type: VARCHAR(30), constraints: { nullable: false } }
              - column: { name: quantity_delta, type: 'DECIMAL(12,3)', constraints: { nullable: false } }
              - column: { name: note, type: VARCHAR(240), constraints: { nullable: false } }
              - column: { name: created_at, type: TIMESTAMP WITH TIME ZONE, defaultValueComputed: CURRENT_TIMESTAMP, constraints: { nullable: false } }
        - createIndex:
            tableName: material_stock_movement
            indexName: ix_material_movement_created
            columns:
              - column: { name: created_at }
        - createIndex:
            tableName: material_stock_movement
            indexName: ix_material_movement_material
            columns:
              - column: { name: material_id }
      rollback:
        - dropTable: { tableName: material_stock_movement }
