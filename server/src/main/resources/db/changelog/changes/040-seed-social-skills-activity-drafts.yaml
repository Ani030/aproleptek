              insert into taxonomy_term(term_type,name,slug,sort_order,active,parent_id,default_description) values ('ACTIVITY_TOPIC','Szociális készségek','szocialis-keszsegek',60,true,null,'A szociális készségek fejlődése segíti a gyermeket a másokkal való kapcsolódásban, a közös játékban, az együttműködésben, az érzések és szükségletek megértésében, valamint a társas helyzetekben való eligazodásban. Az ötletek a közös figyelemtől és utánzástól a szerepjátékon át a konfliktusok békés rendezéséig kínálnak játékos lehetőségeket.') on conflict (term_type,slug) do update set name=excluded.name,sort_order=excluded.sort_order,active=true,parent_id=null,default_description=excluded.default_description;
