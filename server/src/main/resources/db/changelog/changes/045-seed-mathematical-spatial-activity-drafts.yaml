              insert into taxonomy_term(term_type,name,slug,sort_order,active,parent_id,default_description) values ('ACTIVITY_TOPIC','Matematikai és térbeli alapkészségek','matematikai-es-terbeli-alapkepessegek',90,true,null,'A matematikai gondolkodás megalapozása már kisgyermekkorban elkezdődik. Nem a számok megtanulása az elsődleges cél, hanem a mennyiségek, formák, méretek, térbeli viszonyok és szabályszerűségek játékos megtapasztalása.') on conflict (term_type,slug) do update set name=excluded.name,sort_order=excluded.sort_order,active=true,parent_id=null,default_description=excluded.default_description;
              insert into taxonomy_term(term_type,name,slug,sort_order,active,parent_id,default_description)
              select 'ACTIVITY_TOPIC',v.name,v.slug,v.sort_order,true,root.id,v.description from (values
                ('Mennyiségek és mennyiségi viszonyok','mennyisegek-es-mennyisegi-viszonyok',10,'Kevés, sok, több, kevesebb, ugyanannyi, üres és tele.'),
                ('Számlálás és számfogalom','szamlalas-es-szamfogalom',20,'A számnevek, mennyiségek és számjegyek fokozatos összekapcsolása.'),
                ('Formák és geometriai alakzatok','formak-es-geometriai-alakzatok',30,'Formafelismerés, formaazonosítás és geometriai tapasztalatszerzés.'),
