              insert into taxonomy_term(term_type,name,slug,sort_order,active,parent_id,default_description) values ('ACTIVITY_TOPIC','Önállóság és mindennapi életvezetés','onallosag-es-mindennapi-eletvezetes',80,true,null,'Az önállóság fejlesztésének célja, hogy a gyermek fokozatosan képessé váljon a mindennapi tevékenységek elvégzésére, saját szükségleteinek felismerésére, környezetének rendezésére és az életkorának megfelelő feladatok vállalására. A fejlesztés során fontos a sikerélmény, az önbizalom erősítése, a türelmes segítségnyújtás és az önálló próbálkozások támogatása.') on conflict (term_type,slug) do update set name=excluded.name,sort_order=excluded.sort_order,active=true,parent_id=null,default_description=excluded.default_description;
              insert into taxonomy_term(term_type,name,slug,sort_order,active,parent_id)
              select 'ACTIVITY_TOPIC',v.name,v.slug,v.sort_order,true,root.id from (values
                ('Rendrakás és rendszerezés','rendrakas-es-rendszerezes',10),
                ('Öltözködés és önkiszolgálás','oltozkodes-es-onkiszolgalas',20),
                ('Étkezés és konyhai tevékenységek','etkezes-es-konyhai-tevekenysegek',30),
                ('Tisztálkodás és higiénia','tisztalkodas-es-higienia',40),
                ('Mindennapi háztartási feladatok','mindennapi-haztartasi-feladatok',50),
                ('Napirend és időbeli tájékozódás','napirend-es-idobeli-tajekozodas',60),
                ('Feladattudat és felelősségvállalás','feladattudat-es-felelossegvallalas',70),
                ('Önálló döntéshozatal és problémamegoldás','onallo-donteshozatal-es-problemamegoldas',80)) as v(name,slug,sort_order) cross join taxonomy_term root where root.term_type='ACTIVITY_TOPIC' and root.slug='onallosag-es-mindennapi-eletvezetes' on conflict (term_type,slug) do update set name=excluded.name,sort_order=excluded.sort_order,active=true,parent_id=excluded.parent_id;
