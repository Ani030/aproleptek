              insert into taxonomy_term(term_type,name,slug,sort_order,active,parent_id,default_description) values ('ACTIVITY_TOPIC','Érzelmi fejlődés és önszabályozás','erzelmi-fejlodes-es-onszabalyozas',70,true,null,'Az érzelmi fejlődés és önszabályozás támogatja a gyermeket érzései felismerésében, kifejezésében és fokozatos szabályozásában. A közös játékok segíthetnek a várakozás, a megnyugvás, a kudarcok kezelése, a változásokhoz való alkalmazkodás és az érzelmi biztonság megtapasztalásában. Az ötletek 18–36 hónapos gyermekekhez készülnek, és a gyermek aktuális fejlettségéhez igazíthatók.') on conflict (term_type,slug) do update set name=excluded.name,sort_order=excluded.sort_order,active=true,parent_id=null,default_description=excluded.default_description;
