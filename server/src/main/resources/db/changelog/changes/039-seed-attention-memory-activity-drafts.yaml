              insert into taxonomy_term(term_type,name,slug,sort_order,active,parent_id,default_description) values ('ACTIVITY_TOPIC','Figyelem, emlékezet és végrehajtó működések','figyelem-emlekezet-es-vegrehajto-mukodesek',50,true,null,'Ez a fejlesztési terület segíti a gyermekeket abban, hogy összpontosítsanak, megjegyezzék az információkat, kövessék az utasításokat, szabályozzák viselkedésüket, megtervezzék tevékenységeiket és alkalmazkodjanak a változásokhoz.') on conflict (term_type,slug) do update set name=excluded.name,sort_order=excluded.sort_order,active=true,parent_id=null,default_description=excluded.default_description;
              insert into taxonomy_term(term_type,name,slug,sort_order,active,parent_id)
