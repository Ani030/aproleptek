              insert into taxonomy_term(term_type,name,slug,sort_order,active,parent_id,default_description) values ('ACTIVITY_TOPIC','Kreativitás, képzelet és művészeti nevelés','kreativitas-kepzelet-es-muveszeti-neveles',110,true,null,'A kreativitás fejlesztése során a gyermek lehetőséget kap a szabad alkotásra, a képzelete használatára, az érzelmei kifejezésére, a kísérletezésre és az önálló ötletek megvalósítására. A hangsúly nem a kész alkotás szépségén, hanem az alkotás folyamatán és örömén van.') on conflict (term_type,slug) do update set name=excluded.name,sort_order=excluded.sort_order,active=true,parent_id=null,default_description=excluded.default_description;
              insert into taxonomy_term(term_type,name,slug,sort_order,active,parent_id,default_description)
              select 'ACTIVITY_TOPIC',v.name,v.slug,v.sort_order,true,root.id,v.description from (values
                ('Rajzolás, festés és vizuális alkotás','rajzolas-festes-es-vizualis-alkotas',10,'A vizuális önkifejezés, a színérzékelés és az alkotókedv támogatása.'),
                ('Kézműves alkotás és anyagformálás','kezmuves-alkotas-es-anyagformalas',20,'Különböző anyagok megismerése, alakítása és kreatív felhasználása.'),
                ('Építés és konstruktív játék','epites-es-konstruktiv-jatek',30,'A térbeli képzelet, a tervezés, a kreatív problémamegoldás és az önálló ötletek megvalósítása.'),
                ('Szimbolikus játék és szerepjáték','szimbolikus-jatek-es-szerepjatek',40,'A képzelet, a hétköznapi tapasztalatok feldolgozása és a tárgyak szimbolikus használata.'),
                ('Bábozás és dramatikus játék','babozas-es-dramatikus-jatek',50,'Az önkifejezés, az érzelmek megjelenítése, a szerepek kipróbálása és történetek eljátszása.'),
                ('Zenei nevelés és ritmusérzék','zenei-neveles-es-ritmuserzek',60,'A hallási tapasztalatok, a ritmusérzék, a zenei önkifejezés és a zenélés örömének támogatása.'),
                ('Kreatív mozgás és tánc','kreativ-mozgas-es-tanc',70,'A mozgásos önkifejezés, a testtudat, a képzelet és a zene összekapcsolása.'),
                ('Képzelet és kreatív történetalkotás','kepzelet-es-kreativ-tortenetalkotas',80,'A fantázia, az ötletgazdagság, a kreatív gondolkodás és a történetmesélési képesség fejlesztése.')) as v(name,slug,sort_order,description) cross join taxonomy_term root where root.term_type='ACTIVITY_TOPIC' and root.slug='kreativitas-kepzelet-es-muveszeti-neveles' on conflict (term_type,slug) do update set name=excluded.name,sort_order=excluded.sort_order,active=true,parent_id=excluded.parent_id,default_description=excluded.default_description;
